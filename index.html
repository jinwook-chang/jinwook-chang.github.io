---
layout: default
title: Articles
---
<section class="intro" aria-label="글 목록">
  <p class="eyebrow">Articles</p>
</section>
<ol class="essay-list">
  {% assign articles = site.articles | sort: 'date' | reverse %}
  {% for article in articles %}
  <li>
    <h2><a href="{{ article.url | relative_url }}">{{ article.title | escape }} <span aria-hidden="true">↗</span></a></h2>
    {% if article.date %}<time class="written-date" datetime="{{ article.date | date: '%Y-%m-%d' }}">{{ article.date | date: '%Y.%m.%d' }}</time>{% endif %}
  </li>
  {% endfor %}
</ol>
